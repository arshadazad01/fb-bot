<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Messenger Triage | Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #0f172a);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --text-color: var(--tg-theme-text-color, #f8fafc);
      --hint-color: var(--tg-theme-hint-color, #94a3b8);
      --link-color: var(--tg-theme-link-color, #38bdf8);
      --button-color: var(--tg-theme-button-color, #0084ff);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --urgent-high: #ef4444;
      --urgent-med: #f59e0b;
      --urgent-low: #10b981;
      --messenger-blue: #0084ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 75px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(0, 114, 255, 0.35);
    }

    .brand-text h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand-text p {
      font-size: 11px;
      color: var(--hint-color);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      box-shadow: 0 0 8px #10b981;
    }

    .scan-btn {
      background: var(--button-color);
      color: var(--button-text-color);
      border: none;
      outline: none;
      border-radius: 20px;
      padding: 7px 13px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 132, 255, 0.25);
    }

    .scan-btn:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    .scan-btn.scanning {
      background: #475569;
      pointer-events: none;
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      padding: 12px 16px 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display: none; }

    .tab-chip {
      background: var(--secondary-bg);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--hint-color);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-chip.active {
      background: var(--button-color);
      color: #fff;
      border-color: var(--button-color);
    }

    .container {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }

    .stat-number {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--hint-color);
    }

    .thread-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      position: relative;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .thread-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .contact-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      position: relative;
    }

    .avatar-badge {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 13px;
      height: 13px;
      background: #0084ff;
      border-radius: 50%;
      border: 2px solid var(--bg-color);
    }

    .contact-name {
      font-weight: 700;
      font-size: 14px;
    }

    .contact-time {
      font-size: 11px;
      color: var(--hint-color);
    }

    .urgency-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .urgency-high {
      background: rgba(239, 68, 68, 0.18);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .urgency-med {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .urgency-low {
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .message-bubble {
      background: rgba(15, 23, 42, 0.6);
      border-left: 3px solid var(--messenger-blue);
      border-radius: 0 10px 10px 0;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.45;
      color: #e2e8f0;
    }

    .draft-box {
      background: rgba(2, 132, 199, 0.12);
      border: 1px dashed rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      padding: 12px;
    }

    .draft-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--link-color);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .draft-text {
      font-size: 13px;
      line-height: 1.4;
      color: #f0f9ff;
      outline: none;
    }

    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-action {
      flex: 1;
      padding: 9px 12px;
      border-radius: 10px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-approve {
      background: #10b981;
      color: white;
    }

    .btn-dismiss {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .btn-action:active {
      transform: scale(0.97);
    }

    .empty-state {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 36px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 4px;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
    }

    .empty-desc {
      font-size: 13px;
      color: var(--hint-color);
      max-width: 280px;
      line-height: 1.45;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 600;
      color: var(--hint-color);
      cursor: pointer;
      background: none;
      border: none;
    }

    .nav-item.active {
      color: var(--button-color);
    }

    .nav-icon {
      font-size: 18px;
    }

    .toast {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #1e293b;
      border: 1px solid #38bdf8;
      color: #f8fafc;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast">✨ Inbox up to date!</div>

  <header>
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-text">
        <h1>Messenger Triage</h1>
        <p><span class="status-dot"></span> Active &bull; Sync 30m</p>
      </div>
    </div>
    <button id="scanBtn" class="scan-btn" onclick="triggerScan()">
      <span>🔄</span> <span>Scan Now</span>
    </button>
  </header>

  <div class="tab-bar">
    <div class="tab-chip active" onclick="filterTab('all', this)" id="tab-all">All</div>
    <div class="tab-chip" onclick="filterTab('high', this)" id="tab-high">🚨 Urgent</div>
    <div class="tab-chip" onclick="filterTab('med', this)" id="tab-med">⚠️ Follow-up</div>
    <div class="tab-chip" onclick="filterTab('low', this)" id="tab-low">💬 Routine</div>
  </div>

  <div class="container" id="mainContainer">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-number" id="stat-urgent" style="color: #f87171;">0</div>
        <div class="stat-label">Urgent Alert</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-drafted" style="color: #38bdf8;">0</div>
        <div class="stat-label">AI Drafted</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-rate" style="color: #10b981;">100%</div>
        <div class="stat-label">Triage Rate</div>
      </div>
    </div>

    <div id="cardsList" style="display: flex; flex-direction: column; gap: 12px;"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchNav(this)">
      <span class="nav-icon">📬</span>
      <span>Triage</span>
    </button>
    <button class="nav-item" onclick="switchNav(this); showToast('VIP List: Marketplace, Close Friends, Family')">
      <span class="nav-icon">⭐</span>
      <span>VIP Rules</span>
    </button>
    <button class="nav-item" onclick="switchNav(this); showToast('Cron monitoring active every 30m')">
      <span class="nav-icon">⚙️</span>
      <span>Schedule</span>
    </button>
  </nav>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#0f172a');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#0f172a');
    }

    function haptic(type = 'light') {
      try {
        if (tg?.HapticFeedback) {
          if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
          else if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
          else tg.HapticFeedback.impactOccurred('medium');
        }
      } catch (e) {}
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2400);
    }

    let allThreads = [];
    let currentFilter = 'all';

    async function loadData() {
      try {
        const res = await fetch('./data.json?t=' + Date.now());
        if (!res.ok) throw new Error('Data not found');
        const data = await res.json();
        allThreads = data.threads || [];
        renderFeed(allThreads);
      } catch (err) {
        console.log('Using default state:', err);
        renderFeed([]);
      }
    }

    function renderFeed(threads) {
      const container = document.getElementById('cardsList');
      container.innerHTML = '';

      let urgentCount = 0;
      let draftedCount = 0;

      threads.forEach(t => {
        if (t.urgency === 'high') urgentCount++;
        if (t.proposed_reply) draftedCount++;
      });

      document.getElementById('stat-urgent').innerText = urgentCount;
      document.getElementById('stat-drafted').innerText = draftedCount;

      const filtered = threads.filter(t => currentFilter === 'all' || t.urgency === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎉</div>
            <div class="empty-title">All Caught Up!</div>
            <div class="empty-desc">No unread priority messages in your Facebook Messenger right now. Background checks run every 30m.</div>
          </div>
        `;
        return;
      }

      filtered.forEach((item, idx) => {
        const initials = (item.contact_name || 'U').split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
        const badgeClass = item.urgency === 'high' ? 'urgency-high' : (item.urgency === 'med' ? 'urgency-med' : 'urgency-low');
        const badgeLabel = item.urgency === 'high' ? '🚨 High' : (item.urgency === 'med' ? '⚠️ Medium' : '💬 Routine');

        const card = document.createElement('div');
        card.className = 'thread-card';
        card.id = `card-${idx}`;
        card.innerHTML = `
          <div class="thread-header">
            <div class="contact-info">
              <div class="avatar">
                ${initials}
                <div class="avatar-badge"></div>
              </div>
              <div>
                <div class="contact-name">${item.contact_name || 'Contact'}</div>
                <div class="contact-time">${item.timestamp || 'Recent'}</div>
              </div>
            </div>
            <div class="urgency-badge ${badgeClass}">${badgeLabel}</div>
          </div>

          <div class="message-bubble">
            "${item.snippet || 'New message'}"
          </div>

          ${item.proposed_reply ? `
            <div class="draft-box">
              <div class="draft-label">✍️ Proposed Reply</div>
              <div class="draft-text" contenteditable="true">
                ${item.proposed_reply}
              </div>
            </div>
            <div class="action-row">
              <button class="btn-action btn-approve" onclick="approveCard('card-${idx}', '${item.contact_name}')">
                ✅ Approve & Send
              </button>
              <button class="btn-action btn-dismiss" onclick="dismissCard('card-${idx}')">
                ❌ Dismiss
              </button>
            </div>
          ` : `
            <div class="action-row">
              <button class="btn-action btn-dismiss" onclick="dismissCard('card-${idx}')">
                Mark as Read
              </button>
            </div>
          `}
        `;
        container.appendChild(card);
      });
    }

    function approveCard(cardId, name) {
      haptic('success');
      const card = document.getElementById(cardId);
      card.style.opacity = '0.3';
      card.style.pointerEvents = 'none';
      showToast(`🚀 Sent reply to ${name}!`);
      setTimeout(() => {
        card.style.display = 'none';
      }, 400);
    }

    function dismissCard(cardId) {
      haptic('light');
      const card = document.getElementById(cardId);
      card.style.transform = 'translateX(60px)';
      card.style.opacity = '0';
      setTimeout(() => {
        card.style.display = 'none';
        showToast('❌ Dismissed');
      }, 250);
    }

    function filterTab(type, el) {
      haptic('light');
      document.querySelectorAll('.tab-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      currentFilter = type;
      renderFeed(allThreads);
    }

    function switchNav(el) {
      haptic('light');
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
    }

    function triggerScan() {
      const btn = document.getElementById('scanBtn');
      haptic('medium');
      btn.classList.add('scanning');
      btn.innerHTML = '<span>⏳</span> <span>Scanning...</span>';

      setTimeout(async () => {
        await loadData();
        btn.classList.remove('scanning');
        btn.innerHTML = '<span>🔄</span> <span>Scan Now</span>';
        haptic('success');
        showToast('✅ Inbox up to date!');
      }, 1200);
    }

    loadData();
  </script>
</body>
</html>
